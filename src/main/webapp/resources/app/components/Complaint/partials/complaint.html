<div class="container">
<div class="row">
<div class="col-5">

<div class="complaint mb-2  " 
     >

  <div  ng-repeat="c in seecomplains track by c.complaintId"  class="card shadow-sm h-100">

    <div  ng-if="c.status !== 'RESOLVED'"  class="card-body d-flex flex-column">

      <!-- Title -->
      <h5 class="card-title fw-bold">
      
         {{ c.studentName }}
      </h5>

      {{ c.complaintTitle }}
      <!-- Description -->
      <p class="card-text text-muted">
        {{ c.complaintDescription }}
      </p>

      <!-- Admin Comment -->
      <div ng-if="c.adminComment" class="alert alert-secondary py-2">
        <strong>Admin Comment:</strong> {{ c.adminComment }}
      </div>

      <!-- Status badge -->
      <div class="mb-2">
        <span class="badge bg-warning" ng-if="c.status=='PENDING'">Pending</span>
        <span class="badge bg-info" ng-if="c.status=='PROGRESS'">In Progress</span>
        <span class="badge bg-success" ng-if="c.status=='RESOLVED'">Resolved</span>
        <span class="badge bg-danger" ng-if="c.status=='DECLINE'">Declined</span>
      </div>

      <!-- Update section -->
      <div class="mt-auto">

        <label class="form-label fw-semibold">Update Status</label>

        <select class="form-select form-select-sm"
                ng-model="c.updateData.status"
                ng-options="status for status in statusOptions">
          <option value="">Select status</option>
        </select>


       <input ng-show="c.updateData.status === 'DECLINE'"
       ng-model="c.updateData.adminComment"
       class="form-control form-control-sm mt-2"
       placeholder="Reason for decline">

        <button class="btn btn-primary btn-sm w-100 mt-3"
                ng-click="updatecomplaints(c.complaintId, c.updateData)">
          Update Complaint
        </button>

      </div>

    </div>
  </div>

</div>

</div>

</div>

</div>
